<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle with safe padding -->
  <rect width="512" height="512" rx="128" fill="#0F172A"/>
  
  <!-- Outer glowing ring -->
  <circle cx="256" cy="256" r="210" fill="url(#shieldGrad)" stroke="#10B981" stroke-width="12"/>

  <!-- Inner shield icon -->
  <path d="M256 80 L380 130 V260 C380 345 325 410 256 440 C187 410 132 345 132 260 V130 Z" fill="url(#emeraldGrad)" />

  <!-- Shield highlight checkmark and vault symbol -->
  <path d="M210 255 L245 290 L315 210" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Text Brand HLG -->
  <text x="256" y="380" font-family="system-ui, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">HLG</text>
</svg>
